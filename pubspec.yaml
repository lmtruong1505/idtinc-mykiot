flutter_assets:
  assets_path: assets/
  output_path: lib/gen/

flutter:

  uses-material-design: true

  assets:
    - assets/icons/
    - assets/icons/customer/
    - assets/icons/debt/
    - assets/icons/inventory/
    - assets/icons/menu/
    - assets/icons/menu_v2/
    - assets/icons/noti/
    - assets/icons/order_tab/
    - assets/icons/payment_type/
    - assets/icons/report/
    - assets/icons/type_account/
    - assets/imgs/
    - assets/imgs/home/
    - assets/imgs/login/
    - assets/
    - assets/svg/

  # example:
  fonts:
    - family: SanFra
      fonts:
        - asset: assets/fonts/SanFrancisco/SanFranciscoText-Regular.otf
        - asset: assets/fonts/SanFrancisco/SanFranciscoText-Medium.otf
        - asset: assets/fonts/SanFrancisco/SanFranciscoText-Bold.otf
        - asset: assets/fonts/SanFrancisco/SanFranciscoText-Light.otf
        - asset: assets/fonts/SanFrancisco/SanFranciscoText-Semibold.otf
    - family: Roboto
      fonts:
        
        - asset: assets/fonts/Roboto/Roboto-Light.ttf
          weight: 300
        - asset: assets/fonts/Roboto/Roboto-Regular.ttf
          weight: 400
        - asset: assets/fonts/Roboto/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/Roboto/Roboto-Bold.ttf
          weight: 700

    - family: FontAwesome
      fonts:
        - asset: assets/fonts/icon_fonts/fa-thin-100.ttf
          weight: 100 
        - asset: assets/fonts/icon_fonts/fa-light-300.ttf
          weight: 300
        - asset: assets/fonts/icon_fonts/fa-regular-400.ttf
          weight: 400
        - asset: assets/fonts/icon_fonts/fa-solid-900.ttf
          weight: 900     

  generate: true